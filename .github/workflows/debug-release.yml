name: Debug release run

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'debug/release-v0.2.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out debug branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Inspect recovery release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SHA: ed82132b810e507a7d04f1c3797118c298b33637
        run: |
          set -euo pipefail
          REPORT=release-recovery-debug.txt
          if [[ -f "$REPORT" ]]; then
            exit 0
          fi

          RUN_ID=""
          for attempt in {1..30}; do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RECOVERY_SHA}&per_page=20" --jq '.workflow_runs[] | select(.name == "Release") | .id' | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "No Release run found for ${RECOVERY_SHA}" > "$REPORT"
          else
            gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status || true
            {
              echo "Recovery release debug for ${RECOVERY_SHA}"
              echo
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,name,event,status,conclusion,url,createdAt,updatedAt
              echo
              echo "--- Jobs ---"
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY"
              echo
              echo "--- Failed logs ---"
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
              echo
              echo "--- npm version ---"
              npm view @rkbkosp/pi-provider-clone@0.2.1 version || true
              echo
              echo "--- tag ---"
              git ls-remote --tags origin refs/tags/v0.2.1 || true
              echo
              echo "--- GitHub release ---"
              gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" --json tagName,name,url,isDraft,isPrerelease,targetCommitish || true
            } > "$REPORT"
          fi
      - name: Commit diagnostic report
        shell: bash
        run: |
          git add release-recovery-debug.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: record v0.2.1 recovery diagnostics"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

name: Regenerate lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'chore/group-pi-dependabot-updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      - name: Regenerate and audit-fix package lock
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit package lock
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile security patches"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

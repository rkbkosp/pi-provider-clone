name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
      - .github/scripts/release-state.ts
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm and GitHub release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TOKEN_FALLBACK: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Inspect release state
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-state.ts "$RUNNER_TEMP/release-notes.md"

      - name: Check out original release source
        if: steps.meta.outputs.complete != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.release_sha }}
          fetch-depth: 0

      - name: Ensure OIDC-capable npm
        if: steps.meta.outputs.complete != 'true' && steps.meta.outputs.published != 'true'
        run: npm install --global "npm@^11.5.1"

      - name: Install dependencies
        if: steps.meta.outputs.complete != 'true' && steps.meta.outputs.published != 'true'
        run: npm ci --ignore-scripts

      - name: Run release checks
        if: steps.meta.outputs.complete != 'true' && steps.meta.outputs.published != 'true'
        run: |
          npm run check
          npm audit --audit-level=high
          npm pack --dry-run

      - name: Publish to npm with trusted publishing
        id: publish-oidc
        if: steps.meta.outputs.published != 'true'
        continue-on-error: true
        run: npm publish --access public

      - name: Publish to npm with token fallback
        if: steps.meta.outputs.published != 'true' && steps.publish-oidc.outcome == 'failure' && env.NPM_TOKEN_FALLBACK != ''
        shell: bash
        run: |
          set -euo pipefail
          if NPM_STATE="$(npm view "${{ steps.meta.outputs.package }}@${{ steps.meta.outputs.version }}" version --json)"; then
            echo "Package was published by the previous attempt; skipping token fallback."
            exit 0
          fi
          # A registry outage or authentication error is not permission to publish.
          printf '%s' "$NPM_STATE" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              if (JSON.parse(input).error?.code !== "E404") process.exit(1);
            });
          '

          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN_FALLBACK" > "$RUNNER_TEMP/npmrc"
          npm publish --access public --userconfig "$RUNNER_TEMP/npmrc"

      - name: Verify npm publication
        if: steps.meta.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.meta.outputs.version }}"
          PACKAGE="${{ steps.meta.outputs.package }}"
          for attempt in {1..12}; do
            PUBLISHED="$(npm view "${PACKAGE}@${EXPECTED}" version 2>/dev/null || true)"
            if [[ "$PUBLISHED" == "$EXPECTED" ]]; then
              echo "Verified ${PACKAGE}@${EXPECTED} on npm."
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then
              echo "npm registry has not exposed ${PACKAGE}@${EXPECTED} yet (attempt ${attempt}/12); retrying."
              sleep 5
            fi
          done
          echo "Expected npm version ${EXPECTED}, but it was not visible after 12 attempts." >&2
          exit 1

      - name: Create release tag
        if: steps.meta.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE_SHA="${{ steps.meta.outputs.release_sha }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            EXISTING="$(git rev-list -n 1 "${TAG}")"
            if [[ "${EXISTING}" != "${RELEASE_SHA}" ]]; then
              echo "${TAG} already exists at ${EXISTING}, expected ${RELEASE_SHA}" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${RELEASE_SHA}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub release
        if: steps.meta.outputs.complete != 'true' && steps.meta.outputs.released != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
